# Fly.io app configuration
# Deploy with: fly launch --dockerfile backend/Dockerfile
# Then: fly deploy

app = "captionforge-api"
primary_region = "sin"  # Singapore - closest to Asia

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  WHISPER_MODEL = "base"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
